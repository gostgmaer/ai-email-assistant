[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "easydev-file-upload-sdk",
    "email-validator>=2.3.0",
    "extract-msg>=0.56.0",
    "fastapi>=0.141.1",
    "langdetect>=1.0.9",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
easydev-file-upload-sdk = { git = "https://github.com/gostgmaer/file-upload-service.git", subdirectory = "sdk-python", rev = "main" }
