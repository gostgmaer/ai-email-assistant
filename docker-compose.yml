services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-email-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_email
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_email"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-email-redis

    restart: unless-stopped

    ports:
      # Host port remapped to 6380 to avoid colliding with other projects'
      # Redis containers on the default 6379 — internal container-to-
      # container traffic (REDIS_HOST=redis, REDIS_PORT=6379 below) is
      # unaffected, this only changes host-machine access.
      - "6380:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-email-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@easydev.ai
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: ai-email-ai

    restart: unless-stopped

    env_file:
      - apps/ai/.env

    environment:
      # host.docker.internal reaches a file-upload-service run directly on
      # the host (outside this compose stack) for local dev/testing.
      FILE_SERVICE_URL: http://host.docker.internal:5000

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-email-api

    restart: unless-stopped

    env_file:
      - apps/api/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_email?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8000
      FILE_SERVICE_URL: http://host.docker.internal:5000

    ports:
      - "3000:3000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-email-worker

    restart: unless-stopped

    env_file:
      - apps/api/.env

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_email?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8000
      FILE_SERVICE_URL: http://host.docker.internal:5000

    command: ["node", "dist/main.worker.js"]

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000

    container_name: ai-email-web

    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data: